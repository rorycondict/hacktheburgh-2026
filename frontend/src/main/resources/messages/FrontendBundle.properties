design.copied=Prompt copied. Paste it into the agent chat. The agent reaches the floorplan tools through the IDE MCP server (Settings | Tools | MCP Server), so enable it there if needed.
design.prompt=Use the floorplan MCP tools to design the Floorplan map of this project. Call floorplan_get_codebase first. Then decide which parts of the codebase are worth showing and group them into 5-10 themed rooms with floorplan_design_room: pick the room kind that matches each part (LIVING_ROOM for entry points and main functions, KITCHEN for factories and builders, DINING_ROOM for public APIs, BATHROOM for small utilities, WORKSHOP for core logic, BEDROOM for state and persistence, STUDY for models and types, GALLERY for UI, UTILITY_ROOM for networking/IO, LAB for tests, LIBRARY for docs, STORAGE for config/build, GREENHOUSE for assets, LOBBY for top-level files). Give every file a short themed label that says what it does, e.g. "Stove: cooks up sessions (SessionFactory)". Use connectedTo to link rooms whose code depends on each other, so related rooms end up next door.
